# Specifies the Kubernetes API version used to create this resource.
apiVersion: v1
# Specifies the type of Kubernetes resource we want to create.
# Here, we are creating a Secret.
kind: Secret
# Contains information that identifies the Secret.
metadata:
  # Name of the Secret.
  # Other Kubernetes resources can refer to this Secret by its name.
  name: gamehub-db-secret
  # Namespace in which this Secret will be created.
  namespace: gamehub
# Specifies the type of Secret.
# Opaque is used for storing arbitrary user-defined key-value data,
# such as database usernames and passwords.
type: Opaque
# Defines the key-value data stored in the Secret.
# Kubernetes automatically converts these string values into the
# encoded data format used internally by Secrets.
stringData:
  # Username used by the GameHub applications to connect to PostgreSQL.
  POSTGRES_USER: user
  # Password used by the GameHub applications to authenticate with PostgreSQL.
  POSTGRES_PASSWORD: password
  # Name of the PostgreSQL database used by GameHub.
  POSTGRES_DB: gamehub
  # Service name used by applications to locate PostgreSQL inside the cluster.
  # Kubernetes DNS resolves this name to the PostgreSQL Service IP.
  POSTGRES_HOST: postgres