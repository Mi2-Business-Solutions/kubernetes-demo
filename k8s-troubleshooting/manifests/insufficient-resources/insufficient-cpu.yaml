
# Specifies the Kubernetes API version for Deployment resources.
apiVersion: apps/v1

# Specifies the type of Kubernetes resource we want to create.
kind: Deployment

# Contains identifying information about the Deployment.
metadata:
  # Name of our test Deployment.
  name: insufficient-cpu

  # Creates this Deployment inside our troubleshooting namespace,
  # keeping it separate from the GameHub application.
  namespace: k8s-troubleshooting

# Defines the desired state of the Deployment.
spec:
  # We need only one Pod for this experiment.
  replicas: 1

  # Identifies which Pods belong to this Deployment.
  # These labels must match the labels defined in the Pod template.
  selector:
    matchLabels:
      app: insufficient-cpu

  # Defines the configuration of the Pod that the Deployment creates.
  template:
    metadata:
      # Labels assigned to the Pod.
      # The Deployment uses these labels to identify and manage its Pod.
      labels:
        app: insufficient-cpu

    # Defines the Pod's specification.
    spec:
      containers:
        # Configuration of the container inside the Pod.
        - name: cpu-test

          # Ubuntu image used to create the container.
          image: ubuntu

          # Runs a shell command inside the container.
          # Prints a message every 10 seconds and continues running.
          command: ["/bin/bash", "-c", "while true; do echo CPU test running; sleep 10; done"]

          # Defines the CPU and memory resources for the container.
          resources:
            # Minimum resources Kubernetes uses when scheduling the Pod.
            requests:
              #cpu: "13" #This value is intentionally set higher than the node's allocatable CPU to simulate insufficient resources.
              cpu: "100m"

            # Maximum resources the container is allowed to consume.
            limits:
              #cpu: "14" #This value is intentionally set higher than the node's allocatable CPU to simulate insufficient resources.
              cpu: "500m"
