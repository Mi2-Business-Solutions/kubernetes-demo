# Specifies the Kubernetes API version used to create this resource.
apiVersion: v1
# Specifies the type of Kubernetes resource we want to create.
# Here, we are creating a Service.
kind: Service
# Contains information that identifies the Service.
metadata:
  # Name of the Service.
  # Other resources inside the cluster can use this name to communicate with PostgreSQL.
  name: postgres
  # Namespace in which this Service will be created.
  namespace: gamehub
# Defines how the Service should behave.
spec:
  # ClusterIP exposes the Service using an internal IP address within the Kubernetes cluster.
  # It allows other resources inside the cluster to communicate with PostgreSQL.
  type: ClusterIP
  # Identifies which Pods should receive traffic from this Service.
  # The Service looks for Pods having the label app: postgres.
  selector:
    app: postgres
  # Defines the ports through which the Service handles traffic.
  ports:
    # Port on which the Service receives traffic inside the cluster.
    - port: 5432
      # Port on which PostgreSQL listens inside the Pod.
      # The Service forwards incoming traffic to this port.
      targetPort: 5432
      # Specifies the network protocol used for communication.
      # PostgreSQL uses TCP.
      protocol: TCP