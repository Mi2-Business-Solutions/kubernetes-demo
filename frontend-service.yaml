# Specifies the Kubernetes API version used to create this resource.
apiVersion: v1
# Specifies the type of Kubernetes resource we want to create.
# Here, we are creating a Service.
kind: Service
# Contains information that identifies the Service.
metadata:
  # Name of the Service.
  name: frontend-service
  # Namespace in which this Service will be created.
  namespace: gamehub
# Defines how the Service should behave.
spec:
  # Specifies the type of Service.
  # NodePort exposes the application through a port on the Kubernetes node.
  type: NodePort
  selector:
    # Identifies which Pods should receive traffic from this Service.
    # The Service looks for Pods having the label app: gamehub-frontend.
    app: gamehub-frontend
  # Defines the ports through which the Service handles traffic.
  ports:
    - protocol: TCP
      # Port on which the Service receives traffic inside the cluster.
      port: 80
      # Port on which the frontend application listens inside the Pod.
      # The Service forwards incoming traffic to this port.
      # port : Port on which the Service receives traffic	: 80
      # targetPort: Port on which the application container receives traffic	: 80
      targetPort: 80