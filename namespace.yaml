# Specifies the Kubernetes API version used to create this resource.
apiVersion: v1

# Specifies the type of Kubernetes resource we want to create.
# Here, we are creating a Namespace.
kind: Namespace

# Contains information that identifies the Namespace.
metadata:
  # Name of the Namespace.
  # We will use this Namespace to organize all GameHub resources.
  name: gamehub
